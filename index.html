<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="responsive.css" />
    <title>Black Cat Tattoo | Estúdio de Tatuagem</title>
  </head>
  <body>
    <!-- NAVEGAÇÃO -->
    <header class="navbar" id="navbar">
      <a href="#inicio" class="navbar-logo">BLACK CAT <span>TATTOO</span></a>

      <button
        class="menu-toggle"
        id="menu-toggle"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="navbar-links"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav
        class="navbar-links"
        id="navbar-links"
        aria-label="Navegação principal"
      >
        <a href="#inicio" class="active">Início</a>
        <a href="#tatuador">O tatuador</a>
        <a href="#portfolio">Portfólio</a>
        <a href="#duvidas">Dúvidas frequentes</a>
        <a href="#orcamento">Orçamento</a>
      </nav>
    </header>

    <!-- SESSÃO HERO -->
    <section class="hero" id="inicio">
      <img
        src="assets/teste.jpg"
        alt="Ambiente do estúdio Black Cat Tattoo"
        class="hero-image"
      />

      <div class="hero-overlay"></div>

      <div class="hero-content">
        <h1>BLACK CAT <span>TATTOO</span></h1>
        <p>
          Estúdio de tatuagem em Campos do Jordão, especializado em tatuagens
          autorais e projetos personalizados.
        </p>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
